<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 테스트</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .image-container {
            margin-top: 20px;
            padding: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>웹사이트 테스트 페이지입니다</h1>
    <p>요청하신 새로운 이미지가 아래에 표시됩니다.</p>

    <div class="image-container">
        <!-- 수정된 이미지 태그 -->
        <img width="400" height="434" alt="Image" src="https://github.com/user-attachments/assets/c3d3779e-f91a-487f-a5ab-a1d6c50e4625" />
    </div>

</body>
</html>
